name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential g++
    
    - name: Configure with CMake
      run: |
        mkdir -p build
        cd build
        cmake .. -DHLSLCC_LIBRARY_SHARED=OFF
    
    - name: Build
      run: |
        cd build
        make -j$(nproc)
    
    - name: Verify build
      run: |
        ls -la build/
        find build -type f \( -name "libhlslcc*" -o -name "hlslcc*" \)
